<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Mirror - Abstract Soul Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 90%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .title {
            color: #e0e0e0;
            font-size: 2.5em;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 0 20px rgba(224, 224, 224, 0.5);
            letter-spacing: 2px;
        }

        .mirror-frame {
            position: relative;
            width: 400px;
            height: 500px;
            background: linear-gradient(135deg, #2d2d3d 0%, #1a1a2e 100%);
            border: 15px solid;
            border-image: linear-gradient(135deg, #e0a76f 0%, #d4af37 50%, #e0a76f 100%) 1;
            border-radius: 20px;
            box-shadow: 
                0 0 40px rgba(224, 176, 55, 0.5),
                inset 0 0 40px rgba(0, 0, 0, 0.8),
                0 20px 60px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        .mirror-surface {
            width: 100%;
            height: 100%;
            position: relative;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.1) 25%, 
                rgba(255, 255, 255, 0.05) 50%, 
                rgba(255, 255, 255, 0.1) 75%, 
                transparent 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reflection-content {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .original {
            z-index: 2;
            opacity: 1;
            transform: scaleX(1);
        }

        .reflected {
            z-index: 1;
            opacity: 0.7;
            transform: scaleX(-1) scaleY(-1);
            filter: blur(2px) brightness(0.6);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translateX(-50%) translateY(-50%) scaleX(-1) scaleY(-1);
        }

        .animation-text {
            font-size: 2em;
            color: #e0e0e0;
            text-align: center;
            text-shadow: 0 0 15px rgba(224, 224, 224, 0.8);
            line-height: 1.4;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: radial-gradient(circle, #e0a76f 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .controls {
            margin-top: 40px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            font-size: 1em;
            background: linear-gradient(135deg, #e0a76f 0%, #d4af37 100%);
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(224, 176, 55, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(224, 176, 55, 0.6);
            background: linear-gradient(135deg, #d4af37 0%, #e0a76f 100%);
        }

        button:active {
            transform: translateY(-1px);
        }

        .info {
            margin-top: 20px;
            color: #a0a0a0;
            text-align: center;
            font-size: 0.9em;
            max-width: 600px;
        }

        .mirror-shine {
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.3) 50%, 
                transparent 100%);
            animation: shine 3s infinite;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .float {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">✦ Mirror of the Soul ✦</div>
        
        <div class="mirror-frame">
            <div class="mirror-surface">
                <div class="reflection-content original" id="original">
                    <div class="animation-text">
                        <span>Seeking</span><br><span>Freedom</span>
                    </div>
                </div>
                <div class="reflection-content reflected" id="reflected">
                    <div class="animation-text">
                        <span>Seeking</span><br><span>Freedom</span>
                    </div>
                </div>
            </div>
            <div class="mirror-shine"></div>
        </div>

        <div class="controls">
            <button onclick="changeScene('freedom')">🕊️ Freedom</button>
            <button onclick="changeScene('journey')">🌅 Journey</button>
            <button onclick="changeScene('hope')">✨ Hope</button>
            <button onclick="changeScene('transform')">🔄 Transform</button>
            <button onclick="createParticles()">💫 Particles</button>
        </div>

        <div class="info">
            <p>👁️ Look into the mirror. Watch your reflection reveal your inner truth. Click buttons to transform the reflection.</p>
        </div>
    </div>

    <script>
        const scenes = {
            freedom: {
                text: '🕊️<br>Rising<br>Free',
                color: '#e0a76f'
            },
            journey: {
                text: '🌅<br>Ascending<br>Journey',
                color: '#ff6b6b'
            },
            hope: {
                text: '✨<br>Glowing<br>Hope',
                color: '#4ecdc4'
            },
            transform: {
                text: '🔄<br>Becoming<br>Whole',
                color: '#95e1d3'
            }
        };

        function changeScene(scene) {
            const original = document.getElementById('original');
            const reflected = document.getElementById('reflected');
            const sceneData = scenes[scene];

            // Fade out
            original.style.opacity = '0';
            reflected.style.opacity = '0';

            setTimeout(() => {
                original.innerHTML = `<div class="animation-text">${sceneData.text}</div>`;
                reflected.innerHTML = `<div class="animation-text">${sceneData.text}</div>`;
                original.style.color = sceneData.color;
                reflected.style.color = sceneData.color;

                // Fade in with float animation
                original.style.opacity = '1';
                reflected.style.opacity = '0.7';
                original.classList.add('float');

                setTimeout(() => {
                    original.classList.remove('float');
                }, 3000);
            }, 300);

            original.style.transition = 'opacity 0.3s ease';
            reflected.style.transition = 'opacity 0.3s ease';
        }

        function createParticles() {
            const mirrorSurface = document.querySelector('.mirror-surface');
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                particle.style.left = x + '%';
                particle.style.top = y + '%';
                mirrorSurface.appendChild(particle);

                // Animate particles
                const duration = 2 + Math.random() * 2;
                const keyframes = `
                    @keyframes particle-${i} {
                        0% { 
                            opacity: 1; 
                            transform: translate(0, 0);
                        }
                        100% { 
                            opacity: 0; 
                            transform: translate(${(Math.random() - 0.5) * 100}px, -${Math.random() * 100}px);
                        }
                    }
                `;
                const style = document.createElement('style');
                style.textContent = keyframes;
                document.head.appendChild(style);

                particle.style.animation = `particle-${i} ${duration}s ease-out forwards`;

                setTimeout(() => {
                    particle.remove();
                }, duration * 1000);
            }
        }

        // Auto-change scenes every 5 seconds
        let sceneIndex = 0;
        const sceneKeys = Object.keys(scenes);
        
        setInterval(() => {
            sceneIndex = (sceneIndex + 1) % sceneKeys.length;
            changeScene(sceneKeys[sceneIndex]);
        }, 6000);

        // Parallax effect on mouse move
        document.addEventListener('mousemove', (e) => {
            const mirrorFrame = document.querySelector('.mirror-frame');
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;
            
            mirrorFrame.style.transform = `perspective(1000px) rotateX(${y}deg) rotateY(${x}deg)`;
        });

        // Reset on mouse leave
        document.addEventListener('mouseleave', () => {
            const mirrorFrame = document.querySelector('.mirror-frame');
            mirrorFrame.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
        });
    </script>
</body>
</html>
